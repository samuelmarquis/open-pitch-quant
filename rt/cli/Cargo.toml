[package]
name = "opq-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "opq"
path = "src/main.rs"

[dependencies]
opq-engine = { path = "../engine" }
# The family's sample files: WAV, AIFF and FLAC in, WAV out.
audiokit = { path = "../../../open-audiokit", features = ["sample"] }
midly = "0.5"
